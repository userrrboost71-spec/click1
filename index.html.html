<!DOCTYPE html>
<html>
    <head>
        <title>Clicks Game</title>
        <style> 
    body {

        h1 {
    font-size: 50px;
    margin-bottom: 30px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
}
button {
    padding: 15px 30px;
    margin: 8px;

    font-size: 18px;
    font-weight: bold;

    color: white;
    background: #111827;

    border: 2px solid #00ffff;
    border-radius: 12px;

    cursor: pointer;

    box-shadow: 0 0 10px #00ffff;

    transition: 0.2s;
}

button:hover {
    background: #00ffff;
    color: #111827;

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px #00ffff;
}

button:active {
    transform: scale(0.95);
}
    margin: 0;
    min-height: 100vh;

    background: radial-gradient(circle at top, #312e81, #09090f 70%);

    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}
.stats {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    width: 120px;
    padding: 15px 10px;

    background: rgba(17, 24, 39, 0.8);

    border: 1px solid #00ffff;
    border-radius: 15px;

    box-shadow: 0 0 12px #00ffff;
}

.stat span {
    font-size: 25px;
}

.stat p {
    margin: 8px 0 0;
    font-size: 16px;
}
.click-button {
    width: 220px;
    height: 220px;

    border-radius: 50%;
    touch-action: manipulation;

    font-size: 22px;
    font-weight: bold;

    color: white;
    background: #111827;

    border: 3px solid #00ffff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px #00ffff;

    cursor: pointer;

    transition: 0.15s;

    margin: 20px;
}

.click-button:hover {
    box-shadow:
        0 0 20px #00ffff,
        0 0 50px #00ffff;
}

.click-button:active {
    transform: scale(0.9);

    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;
}
.plus-one {
    position: fixed;
    color: #00ffff;
    font-size: 28px;
    font-weight: bold;

    pointer-events: none;

    animation: flyUp 0.8s ease-out forwards;

    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff;
}

@keyframes flyUp {
    0% {
        transform: translateY(0);
        opacity: 1;
    }

    100% {
        transform: translateY(-80px);
        opacity: 0;
    }
}
        </style>
    </head>

    <body>
        <h1> CLICK GAME</h1>
        <div class="stats">
    <div class="stat">
        <span>⭐</span>
        <p id="score">Очки: 0</p>
    </div>

    <div class="stat">
        <span>🏆</span>
        <p id="best">Рекорд: 0</p>
    </div>

    <div class="stat">
        <span>⏱️</span>
        <p id="time">Час: 10</p>
    </div>
</div>
        <button class="click-button" onclick="addPoint()">НАТИСНИ МЕНЕ ⚡</button>
        <button onclick="startGame()">Почати гру</button>
        <button onclick="restartGame()">Грати ще раз</button>
        <p id="result"></p>
       <script>
    let score = 0;
    let time = 10;
    let timer; 
    let bestScore = localStorage.getItem("bestScore") || 0;
    let gameStarted = false;
    
    document.getElementById("best").innerHTML="Рекорд:" + bestScore + "🏆"
    function addPoint() {
    if (gameStarted && time > 0) {
        score = score + 1;

        document.getElementById("score").innerHTML =
            "Очки: " + score;

        if (score > bestScore) {
            bestScore = score;

            localStorage.setItem("bestScore", bestScore);

            document.getElementById("best").innerHTML =
                "Рекорд: " + bestScore + " 🏆";
        }

        let plus = document.createElement("div");

        plus.innerHTML = "+1";
        plus.className = "plus-one";

        plus.style.left = Math.random() * 80 + 10 + "%";
        plus.style.top = "50%";

        document.body.appendChild(plus);

        setTimeout(function() {
            plus.remove();
        }, 800);
    }
}    

    function startGame() {
        clearInterval(timer);
        time=10; 
        score=0;
        gameStarted = true;
        document.getElementById("time").innerHTML = "Час: " + time;

        document.getElementById("score").innerHTML = "Очки: " + score;

        document.getElementById("result").innerHTML = "";


        timer = setInterval(function() {
        time = time - 1;

        document.getElementById("time").innerHTML = "Час: " + time;

        if (time <= 0) {
            clearInterval(timer);

            gameStarted = false;

            document.getElementById("result").innerHTML =
                "🏆 Гру закінчено! Твій результат: " + score + " очок";
        }
        }, 1000);
    }
function restartGame() {
    clearInterval(timer);
    time=10;
    score=0;
        document.getElementById("time").innerHTML = "Час: " + time;
        document.getElementById("score").innerHTML = "Очки: " + score;  
        document.getElementById("result").innerHTML = "";
        
    startGame();
}
</script>

    </body>
</html>
